# ============================================
# SonarCloud Project Configuration
# ============================================

# Project Information
sonar.projectKey=abarnavelusamy_sales-data-pipeline
sonar.organization=abarnavelusamy

# SonarCloud URL
sonar.host.url=https://sonarcloud.io

# Source Code
sonar.sources=src

# Test Code
sonar.tests=tests

# Python Version
sonar.python.version=3.12

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude folders/files
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/logs/**,**/reports/**,**/gx/**

# Test file pattern
sonar.test.inclusions=tests/**/*.py

# Coverage Report
# (We'll generate this in the next step)
sonar.python.coverage.reportPaths=coverage.xml